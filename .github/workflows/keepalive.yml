name: Supabase keepalive

# Evita que Supabase pause el proyecto (plan gratuito) por inactividad.
# Se ejecuta cada 3 días y también a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
