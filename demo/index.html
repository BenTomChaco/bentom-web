<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2B3990">
<meta name="description" content="Demo del sitio de BenTom Universo de Aventuras: reservas de cumpleaños y panel del dueño.">
<title>BenTom Universo de Aventuras · DEMO</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat+Brush&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Concepto: sitio "sticker y ola". Botones tipo etiqueta con borde grueso y sombra desplazada, olas de color como corte entre secciones (igual que las piezas del salon), calendario en piezas blandas y turnos como entradas de cine. Panel en cajas flotantes que se reordenan solas. */
:root{
  --azul:#2B3990; --marino:#1A1F5C; --dorado:#F5B71A; --naranja:#FF8200; --coral:#F26230;
  --bg:#F5F6FC; --surface:#FFFFFF; --surface-2:#ECEEFA; --fg:#1A1F5C; --muted:#4C5486; --line:#D6DAF0;
  --ink:#1A1F5C; --accent:#F5B71A; --on-accent:#1A1F5C; --prim:#2B3990; --on-prim:#FFFFFF; --hot:#FF8200; --on-hot:#1A1F5C;
  --hero-bg:#2B3990; --hero-fg:#FFFFFF; --hero-soft:#C9CFF5;
  --ok:#17794D; --ok-bg:#DDF3E8; --warn:#8A4B00; --warn-bg:#FFE9C2; --bad:#B3261E; --bad-bg:#FBE0DD; --info:#2B3990; --info-bg:#E1E5FA;
  --thumb:#2B3990; --track:#E3E6F6; --focus:#FF8200;
  --shadow:0 14px 34px -20px rgba(26,31,92,.55);
  --f-disp:'Bagel Fat One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-hand:'Caveat Brush','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1138; --surface:#161B55; --surface-2:#1E2468; --fg:#F4F5FF; --muted:#B7BCEA; --line:#323A92;
  --ink:#050724; --accent:#F5B71A; --on-accent:#1A1F5C; --prim:#F5B71A; --on-prim:#1A1F5C; --hot:#FF8200; --on-hot:#1A1F5C;
  --hero-bg:#161B55; --hero-fg:#FFFFFF; --hero-soft:#B7BCEA;
  --ok:#6EE0A6; --ok-bg:#12382B; --warn:#FFC866; --warn-bg:#40300F; --bad:#FF9C94; --bad-bg:#47191A; --info:#AEB8FF; --info-bg:#232B7A;
  --thumb:#F5B71A; --track:#161B55; --focus:#F5B71A; --shadow:0 14px 34px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1138; --surface:#161B55; --surface-2:#1E2468; --fg:#F4F5FF; --muted:#B7BCEA; --line:#323A92;
  --ink:#050724; --accent:#F5B71A; --on-accent:#1A1F5C; --prim:#F5B71A; --on-prim:#1A1F5C; --hot:#FF8200; --on-hot:#1A1F5C;
  --hero-bg:#161B55; --hero-fg:#FFFFFF; --hero-soft:#B7BCEA;
  --ok:#6EE0A6; --ok-bg:#12382B; --warn:#FFC866; --warn-bg:#40300F; --bad:#FF9C94; --bad-bg:#47191A; --info:#AEB8FF; --info-bg:#232B7A;
  --thumb:#F5B71A; --track:#161B55; --focus:#F5B71A; --shadow:0 14px 34px -20px rgba(0,0,0,.8); color-scheme:dark}

*{box-sizing:border-box}
html{font-size:16px;scrollbar-color:var(--thumb) var(--track);scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:400 1rem/1.55 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:var(--track)}
::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:99px;border:3px solid var(--track)}
img{display:block}
h1,h2,h3,h4{margin:0;line-height:1.1;text-wrap:balance}
h1,h2{font-family:var(--f-disp);font-weight:400;letter-spacing:.01em}
h3{font-weight:700;font-size:1.15rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:12px;z-index:100;font-weight:600}
.skip:focus{top:8px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hand{font-family:var(--f-hand);font-size:1.35em;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* franja demo + encabezado */
.demo-bar{background:var(--marino);color:#fff;font-size:.8rem}
.demo-bar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:99px;padding:3px}
.seg button{border:0;background:none;color:#fff;padding:5px 14px;border-radius:99px;font-weight:600;font-size:.8rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--dorado);color:var(--marino)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:2px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;text-align:left;padding:0}
.logo img{width:52px;height:52px;border-radius:50%;box-shadow:0 4px 0 -1px var(--ink)}
.logo small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;line-height:1.1}
.logo b{display:block;font-family:var(--f-disp);font-weight:400;font-size:1.25rem;line-height:1}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav button.nl{border:0;background:none;padding:9px 14px;border-radius:99px;font-weight:600;cursor:pointer;color:var(--fg)}
.nav button.nl:hover{background:var(--surface-2)}
.nav button.nl[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.icon-btn:hover{border-color:var(--fg)}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:99px;background:var(--coral);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface)}
.burger{display:none}
@media (max-width:860px){
  .burger{display:inline-grid;margin-left:auto}
  .nav{position:absolute;left:0;right:0;top:100%;background:var(--surface);flex-direction:column;align-items:stretch;padding:12px 16px 18px;border-bottom:2px solid var(--line);display:none;margin:0}
  .nav.open{display:flex}
  .nav button.nl{text-align:left}
  .logo small{display:none}
}

/* botones etiqueta */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;cursor:pointer;font-weight:700;font-size:1rem;line-height:1.1;padding:.85em 1.35em;color:var(--on-accent);background:var(--accent);border:3px solid var(--ink);border-radius:1.5em 1.05em 1.45em 1.1em/1.1em 1.5em 1.05em 1.45em;box-shadow:4px 4px 0 var(--ink);transition:transform .16s,box-shadow .16s;text-decoration:none;text-align:center}
.btn:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:4px 4px 0 var(--ink)}
.btn.azul{background:var(--azul);color:#fff}
.btn.naranja{background:var(--hot);color:var(--on-hot)}
.btn.suave{background:var(--surface);color:var(--fg);border-color:var(--ink)}
.btn.hero-ghost{background:transparent;color:#fff;border-color:#fff;box-shadow:4px 4px 0 rgba(255,255,255,.35)}
.btn.sm{font-size:.86rem;padding:.6em 1em;border-width:2px;box-shadow:3px 3px 0 var(--ink)}
.btn.sm:hover{box-shadow:5px 5px 0 var(--ink)}
.btn.xs{font-size:.78rem;padding:.45em .8em;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.link{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:600;cursor:pointer;color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:2px solid var(--line);background:var(--surface);font-weight:600;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"],.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--surface-2);color:var(--muted)}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);position:relative;overflow:hidden;padding-top:clamp(28px,5vw,64px)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:58% 42% 55% 45%/48% 58% 42% 52%;pointer-events:none}
.hero::before{width:min(46vw,520px);aspect-ratio:1;background:var(--dorado);opacity:.16;right:-120px;top:-140px}
.hero::after{width:min(30vw,320px);aspect-ratio:1;background:var(--naranja);opacity:.22;left:-100px;bottom:20px}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(20px,4vw,56px);align-items:center;position:relative;z-index:1;padding-bottom:clamp(54px,8vw,96px)}
.kicker{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.76rem;color:var(--dorado)}
.hero h1{font-size:clamp(2.5rem,6.4vw,4.8rem);margin:14px 0 16px}
.hl-d{color:var(--dorado)}.hl-o{color:var(--naranja)}
.hero .lead{font-size:1.1rem;color:var(--hero-soft);max-width:34em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.chips span{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.28);padding:6px 13px;border-radius:99px;font-weight:600;font-size:.86rem}
.next-free{margin-top:22px;display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--dorado);color:var(--marino);padding:10px 16px;border-radius:18px 28px 18px 28px;font-weight:600;font-size:.92rem}
.next-free b{font-family:var(--f-disp);font-weight:400;font-size:1.05rem}
.hero-fig{margin:0;position:relative;justify-self:center;width:min(100%,340px)}
.hero-fig .frame{background:#fff;padding:10px 10px 36px;border-radius:14px;transform:rotate(2.5deg);box-shadow:0 26px 50px -22px rgba(0,0,0,.7);border:3px solid var(--ink)}
.hero-fig img{width:100%;height:auto;border-radius:6px}
.hero-fig figcaption{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-family:var(--f-hand);font-size:1.25rem;color:var(--marino);transform:rotate(2.5deg)}
.sticker{position:absolute;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.05;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
.sticker.a{width:112px;height:112px;border-radius:50% 46% 52% 48%;background:var(--dorado);color:var(--marino);left:-34px;top:36px;transform:rotate(-12deg);font-size:.82rem}
.sticker.a b{display:block;font-family:var(--f-disp);font-weight:400;font-size:1.9rem}
.sticker.b{padding:10px 14px;border-radius:30px 18px 28px 18px;background:var(--naranja);color:var(--marino);right:-14px;bottom:70px;transform:rotate(7deg);font-size:.84rem}
.wave{display:block;width:100%;height:clamp(34px,5vw,70px)}
.wave.top-w{position:absolute;bottom:-1px;left:0;color:var(--bg)}
@media (max-width:860px){.hero-in{grid-template-columns:1fr}.hero-fig{width:min(78%,300px)}.sticker.a{left:-18px}}

/* secciones */
.sec{padding-block:clamp(36px,6vw,80px)}
.sec.alt{background:var(--surface)}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:28px;max-width:44rem}
.sec-head h2{font-size:clamp(1.9rem,4.4vw,3rem)}
.sec-head p{color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:clamp(16px,2.4vw,24px);box-shadow:var(--shadow)}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.steps3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.step-b{display:flex;gap:14px;align-items:flex-start}
.step-b .n{flex:none;width:46px;height:46px;border-radius:52% 48% 55% 45%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-disp);font-size:1.4rem;border:3px solid var(--ink)}

/* combos */
.combos{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));align-items:stretch}
.combo{display:flex;flex-direction:column;border-radius:28px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);overflow:hidden;background:var(--surface);min-width:0}
.combo-h{padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px}
.combo.c1 .combo-h{background:var(--azul);color:#fff}
.combo.c2 .combo-h{background:var(--dorado);color:var(--marino)}
.combo.c3 .combo-h{background:var(--naranja);color:var(--marino)}
.combo-name{align-self:flex-start;background:#fff;color:var(--marino);font-family:var(--f-disp);font-size:1.5rem;padding:4px 18px;border-radius:30px 20px 32px 18px;border:3px solid var(--ink);transform:rotate(-2deg)}
.combo-price{font-family:var(--f-disp);font-size:clamp(2rem,4vw,2.6rem);line-height:1}
.combo-b{padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
.combo-b ul,.tick-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.combo-b li,.tick-list li{display:flex;gap:9px;align-items:flex-start;font-size:.93rem}
.combo-b li .ic,.tick-list li .ic{color:var(--ok);margin-top:2px}
.plus{display:inline-flex;align-items:center;gap:6px;font-weight:700;background:var(--surface-2);border-radius:99px;padding:5px 12px;font-size:.84rem;align-self:flex-start}
.strip{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:center;background:var(--azul);color:#fff;border-radius:26px 40px 26px 40px;padding:18px 24px;margin-top:26px;border:3px solid var(--ink)}
.strip b{font-family:var(--f-disp);font-weight:400;font-size:1.3rem;color:var(--dorado)}
.strip span{display:inline-flex;gap:7px;align-items:center;font-weight:600}
.tbl-w{overflow-x:auto;border-radius:18px;border:2px solid var(--line);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl thead th{background:var(--surface-2);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl td input[type=number]{width:100%;min-width:96px}

/* calendario */
.cal{display:flex;flex-direction:column;gap:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cal-h h3{font-family:var(--f-disp);font-weight:400;font-size:1.45rem;text-transform:capitalize}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-w{font-size:.72rem;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.08em;text-transform:uppercase;padding-bottom:2px}
.day{position:relative;aspect-ratio:1/.92;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--line);background:var(--surface);border-radius:16px 20px 16px 20px;cursor:pointer;font-weight:700;font-size:.95rem;padding:2px}
.day:hover:not([disabled]){border-color:var(--fg);transform:translateY(-2px)}
.day[disabled]{opacity:.38;cursor:not-allowed}
.day.sel{background:var(--accent);color:var(--on-accent);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.day.hoy{outline:2px dashed var(--hot);outline-offset:2px}
.dots{display:flex;gap:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dorado);border:1.5px solid var(--ink)}
.dot.c{background:var(--naranja)}.dot.o{background:var(--azul)}
.day.sel .dot{border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* entradas (turnos) */
.tickets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.ticket{position:relative;text-align:left;background:var(--surface-2);border:2px solid var(--line);border-radius:18px;padding:14px 16px 14px 22px;cursor:pointer;display:flex;flex-direction:column;gap:3px;border-left:2px dashed var(--fg)}
.ticket::before,.ticket::after{content:"";position:absolute;left:-12px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.ticket::before{top:-11px}.ticket::after{bottom:-11px}
.ticket b{font-family:var(--f-disp);font-weight:400;font-size:1.4rem}
.ticket small{color:var(--muted);font-weight:500}
.ticket.sel{background:var(--accent);color:var(--on-accent);border-color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.ticket.sel small{color:var(--on-accent)}
.ticket[disabled]{opacity:.5;cursor:not-allowed}

/* asistente */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:980px){.wiz{grid-template-columns:1fr}}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.stepper li{list-style:none;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem;color:var(--muted)}
.stepper{padding:0;margin:0 0 20px}
.stepper .n{width:32px;height:32px;border-radius:50% 46% 52% 48%;display:grid;place-items:center;background:var(--surface-2);border:2px solid var(--line);font-weight:800}
.stepper li.on{color:var(--fg)}.stepper li.on .n{background:var(--accent);color:var(--on-accent);border-color:var(--ink)}
.stepper li.done .n{background:var(--ok-bg);color:var(--ok)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:2px solid var(--line);border-radius:18px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--ink);background:var(--surface-2);box-shadow:3px 3px 0 var(--ink)}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--azul)}
.opt.off{opacity:.5;cursor:not-allowed}
.sum{position:sticky;top:96px}
.sum .ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.9rem}
.sum .tot{display:flex;justify-content:space-between;gap:12px;padding-top:12px;font-weight:800;font-size:1.1rem}
.sum .tot b{font-family:var(--f-disp);font-weight:400;font-size:1.7rem}
.counter{display:inline-flex;align-items:center;gap:10px}
.counter button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--accent);color:var(--on-accent);font-weight:800;cursor:pointer;font-size:1.1rem}
.counter output{min-width:2ch;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.88rem}
.field input,.field select,.field textarea,.inp{width:100%;padding:.7em .9em;border:2px solid var(--line);border-radius:14px;background:var(--surface);min-width:0}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--fg);outline:3px solid var(--focus);outline-offset:1px}
.field textarea{min-height:90px;resize:vertical}
.hint{font-size:.8rem;color:var(--muted)}
.err{font-size:.8rem;color:var(--bad);font-weight:600}

/* galeria */
.masonry{columns:3 260px;column-gap:14px}

.masonry button{display:block;width:100%;padding:0;border:3px solid var(--ink);border-radius:20px;overflow:hidden;cursor:pointer;background:var(--surface);box-shadow:4px 4px 0 var(--ink);transition:transform .18s}

.masonry img{width:100%;height:auto}
.masonry figcaption{position:absolute;left:10px;bottom:10px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.76rem;padding:4px 10px;border-radius:99px;border:2px solid var(--ink);pointer-events:none}
.lb{position:fixed;inset:0;z-index:80;background:rgba(5,7,36,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.lb img{max-width:100%;max-height:78vh;width:auto;height:auto;border-radius:12px;border:3px solid #fff}
.lb .bar{display:flex;gap:10px;align-items:center;color:#fff;flex-wrap:wrap;justify-content:center}

/* faq */
details.faq{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:0}
details.faq summary{cursor:pointer;list-style:none;padding:16px 18px;font-weight:700;display:flex;gap:12px;justify-content:space-between;align-items:center}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;border:2px solid var(--ink)}
details.faq[open] summary::after{content:"–"}
details.faq[open]{border-color:var(--fg)}
details.faq .ans{padding:0 18px 18px;color:var(--muted);display:flex;flex-direction:column;gap:8px}

/* invitacion */
.inv-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:26px;align-items:start}
@media (max-width:980px){.inv-wrap{grid-template-columns:1fr}}
.phone{width:min(100%,360px);margin-inline:auto;border:9px solid var(--ink);border-radius:40px;background:#fff;color:#1A1F5C;height:680px;overflow:auto;position:relative;box-shadow:var(--shadow);scrollbar-width:thin}
.phone-open{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px;background:linear-gradient(160deg,#FF8200,#F26230);color:#1A1F5C}

.inv-body{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-bottom:26px;background:#fff}

.inv-badge{width:96px;height:96px;border-radius:50%;margin-top:-48px;border:4px solid #FF8200;background:#1A1A5C;position:relative}

.inv-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding-inline:16px}
.inv-btns a,.inv-btns button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:#fff;border:3px solid #1A1F5C;border-radius:20px 28px 20px 28px;box-shadow:3px 3px 0 #1A1F5C;font-weight:700;font-size:.78rem;text-decoration:none;color:#1A1F5C;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.inv-btns .ic{width:26px;height:26px;color:#2B3990}
.inv-info{margin-inline:16px;background:#ECEEFA;border-radius:18px;padding:14px;text-align:left;font-size:.85rem}
.inv-foot{background:#FF8200;color:#1A1F5C;width:100%;padding:16px;font-weight:700;font-size:.82rem;margin-top:8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.inv-foot button{border:3px solid #1A1F5C;background:#fff;color:#1A1F5C;font-weight:700;border-radius:99px;padding:8px 16px;cursor:pointer}
.tpl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpl button{border:3px solid var(--line);border-radius:16px;overflow:hidden;padding:0;cursor:pointer;background:var(--surface);font-weight:700;font-size:.8rem}
.tpl button[aria-pressed="true"]{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}

/* cuenta */
.money-t{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}

.foot ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.foot .legal{border-top:1px solid rgba(255,255,255,.18);padding-block:14px;font-size:.78rem;color:#C9CFF5;text-align:center}

/* panel */

.side{position:sticky;top:84px;align-self:start;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:12px;box-shadow:var(--shadow)}
.side button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 14px;border-radius:16px;font-weight:600;cursor:pointer;text-align:left;width:100%}
.side button:hover{background:var(--surface-2)}
.side button[aria-current="page"]{background:var(--accent);color:var(--on-accent);box-shadow:3px 3px 0 var(--ink)}

@media (max-width:1000px){
  .panel{grid-template-columns:1fr;padding-top:12px}

}
.p-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}

.pc{background:var(--surface);border:2px solid var(--line);border-radius:26px 32px 26px 32px;padding:18px 20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.pc-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.pc-h h3{display:flex;align-items:center;gap:10px}
.pc-h h3 .bl{width:34px;height:34px;border-radius:52% 48% 55% 45%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);border:2px solid var(--ink)}

.kpi{background:var(--surface);border:2px solid var(--line);border-radius:24px 30px 24px 30px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.kpi small{font-weight:600;color:var(--muted);font-size:.8rem}
.kpi b{font-family:var(--f-disp);font-weight:400;font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.k1{background:var(--accent);color:var(--on-accent);border-color:var(--ink)}.kpi.k1 small{color:var(--on-accent)}
.kpi.k2{background:var(--azul);color:#fff;border-color:var(--ink)}.kpi.k2 small{color:#C9CFF5}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .tx{flex:1 1 200px;min-width:0}

.sev{width:12px;height:12px;border-radius:50%;flex:none}

.pcal .day{aspect-ratio:auto;min-height:74px;align-items:flex-start;justify-content:flex-start;padding:6px;gap:4px;font-size:.85rem}
.pcal .bars{display:flex;flex-direction:column;gap:3px;width:100%}
.pcal .bar{height:8px;border-radius:99px;background:var(--line)}
.pcal .bar.conf{background:var(--azul)}.pcal .bar.pend{background:var(--dorado)}.pcal .bar.res{background:var(--naranja)}.pcal .bar.blq{background:var(--muted)}
[data-theme="dark"] .pcal .bar.conf{background:#8F9CFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pcal .bar.conf{background:#8F9CFF}}
@media (max-width:620px){.pcal .day{min-height:58px;padding:4px}.pcal .bar{height:6px}}
.queue{display:flex;flex-direction:column;gap:10px}
.q-item{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:18px;padding:12px 14px}
.q-pos{width:34px;height:34px;border-radius:50% 46% 52% 48%;display:grid;place-items:center;font-family:var(--f-disp);background:var(--accent);color:var(--on-accent);border:2px solid var(--ink);flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.toolbar .field{flex:1 1 160px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem;margin:0}
.dl dt{color:var(--muted);font-weight:600}.dl dd{margin:0;overflow-wrap:anywhere}
.mini-pre{white-space:pre-wrap;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:.85rem;font-family:var(--f-body)}
.sw{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:.9rem}

.sw input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .15s}
.sw input:checked{background:var(--naranja)}
.sw input:checked::after{transform:translateX(20px)}

/* capas */
.back{position:fixed;inset:0;z-index:70;background:rgba(5,7,36,.66);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);color:var(--fg);border:3px solid var(--ink);border-radius:30px;box-shadow:8px 8px 0 var(--ink);width:min(100%,640px);max-height:calc(100dvh - 32px);overflow:auto;padding:clamp(18px,3vw,28px);display:flex;flex-direction:column;gap:14px}
.modal h3{font-family:var(--f-disp);font-weight:400;font-size:1.6rem}
.modal-x{align-self:flex-end;margin:-8px -8px -4px 0}
.tut-step{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.tut-ic{width:64px;height:64px;border-radius:52% 48% 55% 45%;background:var(--surface-2);border:3px solid var(--ink);display:grid;place-items:center;color:var(--prim)}
.tut-ic .ic{width:30px;height:30px}
.tut-step b{display:block}
.tut-step p{color:var(--muted);font-size:.92rem}
.toasts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 28px))}
.toast{background:var(--surface);color:var(--fg);border:3px solid var(--ink);border-radius:20px 28px 20px 28px;box-shadow:4px 4px 0 var(--ink);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.9rem;animation:pop .28s ease-out}

.notif{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 24px));background:var(--surface);border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:12px;z-index:60;max-height:70vh;overflow:auto}

'use strict';

const slotEstado=(f,tid)=>{const l=evSlot(f,tid);if(l.some(e=>e.estado==='confirmada')||(CFG.bloq&&CFG.bloq[f+'|'+tid]))return'ocupado';if(l.some(e=>e.estado==='pendiente'||e.estado==='comprobante'))return'consultas';return'libre'};
function lines(ev){
 const L=[];const c=COMBOS.find(x=>x.id===ev.combo);
 L.push({t:c.n,m:CFG.precio[ev.combo]});
 Object.keys(ev.extras||{}).forEach(k=>{if(!ev.extras[k])return;const e=EXTRAS.find(x=>x.id===k);const p=e.p[ev.combo];
  if(p==='c')L.push({t:e.n,m:ev.catering||0,nota:ev.catering?'':'a cotizar'});else if(p===0)L.push({t:e.n,m:0,nota:'incluido'});else if(p>0)L.push({t:e.n,m:p})});
 if(ev.ninos>0)L.push({t:ev.ninos+' niño'+(ev.ninos>1?'s':'')+' adicional'+(ev.ninos>1?'es':''),m:ev.ninos*CFG.unit.nino});
 if(ev.bolsitas>0)L.push({t:ev.bolsitas+' bolsita'+(ev.bolsitas>1?'s':'')+' adicional'+(ev.bolsitas>1?'es':''),m:ev.bolsitas*CFG.unit.bolsita});
 if(ev.hx)L.push({t:'Hora extra ('+CFG.hx.min+' min)',m:CFG.hx.precio});
 (ev.ajustes||[]).forEach(a=>L.push({t:a.t,m:a.m}));
 return L;
}
const total=ev=>lines(ev).reduce((s,l)=>s+l.m,0);
const pagos=ev=>ev.pagos.filter(p=>!p.anulado);
const pagado=ev=>pagos(ev).reduce((s,p)=>s+p.base,0);
const saldo=ev=>total(ev)-pagado(ev);
const comboBase=ev=>CFG.precio[ev.combo];
const pct30=ev=>{const need=Math.round(comboBase(ev)*CFG.avisos.pct/100);return{need,ok:pagado(ev)>=need,due:iso(new Date(parse(ev.fecha).getTime()-CFG.avisos.pctDias*864e5))}};
const servicios=ev=>{const s=new Set(COMBO_SVC[ev.combo]);Object.keys(ev.extras||{}).forEach(k=>{if(ev.extras[k])s.add(k)});if(ev.hx)s.add('horaextra');return Array.from(s)};

function toast(msg,t){
 const el=document.createElement('div');el.className='toast '+(t||'ok');el.setAttribute('role','status');
 el.innerHTML=ico(t==='bad'?'alert':t==='warn'?'alert':t==='info'?'info':'check')+'<div>'+esc(msg)+'</div>';
 $('#toasts').appendChild(el);setTimeout(()=>el.remove(),4800);
}

/* ---------- eventos del documento ---------- */
function setPath(path,val){
 const root=path.startsWith('CFG.')?CFG:S;const parts=(path.startsWith('CFG.')?path.slice(4):path).split('.');
 let o=root;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts[parts.length-1]]=val;
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act;
 if(a==='back'){if(e.target!==el)return;closeLayer();return}
 if(ACT[a]){if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();ACT[a](el,e)}
});
function onField(e){
 const el=e.target;if(!el.dataset)return;
 if(el.dataset.in){
  let v=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.num!==undefined)v=Number(v)||0;
  setPath(el.dataset.in,v);
  if(el.dataset.live&&LIVE[el.dataset.live])LIVE[el.dataset.live](el);
  if(e.type==='change'&&el.dataset.render!==undefined)render(true);
  if(e.type==='change'&&el.dataset.saved!==undefined)toast('Cambio guardado. Ya se ve en el sitio.','ok');
 }
 if(e.type==='change'&&el.dataset.chg&&ACT[el.dataset.chg])ACT[el.dataset.chg](el,e);
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeLayer();if(S.notif){S.notif=false;render(true)}}
 if(S.lb!=null&&$('#layer .lb')){if(e.key==='ArrowRight')ACT.lbnav({dataset:{d:1}});if(e.key==='ArrowLeft')ACT.lbnav({dataset:{d:-1}})}
});

/* ---------- reloj ---------- */
function tick(){
 $$('[data-cd]').forEach(el=>{const ms=new Date(el.dataset.cd)-simNow();if(ms<=0){el.textContent='Venció';return}
  const s=Math.floor(ms/1000);el.textContent=p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)});
 $$('[data-cdn]').forEach(el=>{const ms=Math.max(0,new Date(el.dataset.cdn)-simNow());const s=Math.floor(ms/1000);
  const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];$$('b',el).forEach((b,i)=>b.textContent=p2(v[i]))});
}
setInterval(tick,1000);

function calPublic(){
 const w=S.wiz;

  if(!f)return '<div></div>';
  const ts=turnosDia(f);const past=f<=TODAY;const dis=past||!ts.length;
  const st=ts.map(t=>slotEstado(f,t.id));
  const dots=ts.map((t,i)=>'<span class="dot'+(st[i]==='consultas'?' c':st[i]==='ocupado'?' o':'')+'"></span>').join('');
  const lleno=ts.length&&st.every(s=>s==='ocupado');
  const lab=fdate(f,true)+(dis?', no disponible':lleno?', completo':', con turnos disponibles');
  return '<button class="day'+(w.fecha===f?' sel':'')+(f===TODAY?' hoy':'')+'" data-act="wizday" data-v="'+f+'"'+((dis||lleno)?' disabled':'')+' aria-label="'+esc(lab)+'" aria-pressed="'+(w.fecha===f)+'"><span>'+parse(f).getDate()+'</span><span class="dots">'+(dis?'':dots)+'</span></button>';
 }).join('');
 return '<div class="cal">'+calHead(w.y,w.m,'wizmonth')+'<div class="cal-g">'+cells+'</div><div class="legend"><span><i class="dot"></i>Libre</span><span><i class="dot c"></i>Con consultas, reservá cuanto antes</span><span><i class="dot o"></i>Ocupado</span></div></div>';
}

function validar(){
 const d=S.wiz.d,e={};
 if(d.n.trim().length<2)e.n='Escribí tu nombre.';
 if(d.a.trim().length<2)e.a='Escribí tu apellido.';
 const dn=d.dni.replace(/\D/g,'').length;if(dn<7||dn>9)e.dni='Ingresá un DNI válido, entre 7 y 9 números.';
 if(d.wa.replace(/\D/g,'').length<8)e.wa='Ingresá un WhatsApp con código de área.';
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.mail.trim()))e.mail='Revisá el e-mail, por ejemplo nombre@correo.com.';
 if(!S.wiz.acepta)e.acepta='Para continuar tenés que aceptar las condiciones.';
 S.wiz.err=e;return !Object.keys(e).length;
}
const isoDT=d=>iso(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes());
function crearReserva(){
 const w=S.wiz,d=w.d;const n=simNow();
 const ev={id:'EV-0'+(evSeq++),fecha:w.fecha,turno:w.turno,combo:w.combo,extras:Object.assign({},w.extras),ninos:w.ninos,bolsitas:w.bolsitas,hx:w.hx&&hxDisponible(),catering:0,ajustes:[],
  cumple:{n:d.cn.trim(),edad:Number(d.ce)||0,tema:'',nac:d.cnac||''},padre:{n:d.n.trim(),a:d.a.trim(),dni:d.dni.trim(),wa:d.wa.trim(),mail:d.mail.trim(),mkt:!!w.mkt},
  estado:'pendiente',creado:isoDT(n),comprobanteAt:null,notas:'',pagos:[],hist:[fdt(n)+' · Solicitud creada desde el sitio'],inv:false};
 EV.push(ev);S.my=ev.id;S.inv.ev=ev.id;if(ev.cumple.n)S.inv.nombre=ev.cumple.n;if(ev.cumple.edad)S.inv.edad=ev.cumple.edad;

 w.doneId=ev.id;w.step=4;
}

function fotosCard(ev){

 if(!f)return '<div class="card stack"><h3>Tus fotos</h3><p class="muted">Contrataste fotógrafo. Cuando BenTom cargue el enlace de descarga, te avisamos por WhatsApp y por e-mail y lo vas a ver acá. Vas a tener un plazo de '+CFG.fotos.dias+' días para descargarlas.</p></div>';
 const left=dayDiff(f.vence,TODAY);

/* ---------- reglas de reserva ---------- */
function confirmar(ev){
 if(confirmedAt(ev.fecha,ev.turno,ev.id)){toast('Ese turno ya está confirmado para otra reserva.','bad');return false}
 ev.estado='confirmada';
 if(!pagos(ev).length)ev.pagos.push(pago('p'+Date.now(),TODAY,'seña','transferencia',CFG.sena.monto,{n:++rcpt}));
 ev.hist.push(nowStr()+' · Reserva confirmada');
 evSlot(ev.fecha,ev.turno).forEach(o=>{
  if(o.id===ev.id||o.estado==='confirmada'||o.estado==='resolver'||o.estado==='cancelada'||o.estado==='rechazada'||o.estado==='vencida'||o.estado==='ocupado')return;
  if(o.estado==='comprobante'){o.estado='resolver';o.pagos.push(pago('p'+Date.now()+o.id,TODAY,'seña','transferencia',CFG.sena.monto,{nota:'Seña recibida, turno ocupado'}));o.hist.push(nowStr()+' · Turno confirmado a otra reserva: pasa a "a resolver"');notify('bad','Caso a resolver: '+nameOf(o)+' pagó la seña y el turno quedó confirmado para otra familia.',['solicitudes'])}
  else{o.estado='ocupado';o.hist.push(nowStr()+' · Turno ocupado: se avisa a la familia')}
 });
 return true;
}

/* ---- agenda ---- */
function agSt(f,t){
 if(CFG.bloq&&CFG.bloq[f+'|'+t])return 'blq';
 const l=evSlot(f,t);
 if(l.some(e=>e.estado==='confirmada'))return 'conf';
 if(l.some(e=>e.estado==='resolver'))return 'res';
 if(l.some(e=>e.estado==='pendiente'||e.estado==='comprobante'))return 'pend';
 return 'libre';
}
const AGN={libre:'Libre',conf:'Confirmado',pend:'Con solicitud',res:'A resolver',blq:'Bloqueado'};
function libresProx(n){
 const out=[];const d0=parse(TODAY);
 for(let i=1;i<120&&out.length<n;i++){const f=iso(new Date(d0.getTime()+i*864e5));turnosDia(f).forEach(t=>{if(out.length<n&&agSt(f,t.id)==='libre')out.push({f,t})})}
 return out;
}

 wizcombo(el){const w=S.wiz;w.combo=el.value;Object.keys(w.extras).forEach(k=>{if(EXTRAS.find(e=>e.id===k).p[w.combo]==null)delete w.extras[k]});render(true)},

 wizinc(el){const w=S.wiz,k=el.dataset.k;w[k]=Math.max(0,w[k]+Number(el.dataset.d));render(true)},
 comp(el){const ev=evById(S.wiz.doneId);if(!ev||!el.files[0])return;ev.estado='comprobante';ev.comprobanteAt=nowIso();ev.hist.push(nowStr()+' · Comprobante recibido');notify('info','Comprobante recibido de '+nameOf(ev)+' para el '+fdate(ev.fecha)+'.',['solicitudes']);toast('Recibimos tu comprobante. BenTom lo verifica y te confirma.','ok');render(true)},
 mine(el){S.my=el.dataset.v;go('cuenta')},
 'inv-ev'(el){const ev=evById(el.dataset.v);S.inv.ev=ev.id;if(ev.cumple.n)S.inv.nombre=ev.cumple.n;if(ev.cumple.edad)S.inv.edad=ev.cumple.edad;ev.inv=true;go('invitacion')},
 invver(el){const ev=evById(el.dataset.id);S.inv.ev=ev.id;if(ev.cumple.n)S.inv.nombre=ev.cumple.n;if(ev.cumple.edad)S.inv.edad=ev.cumple.edad;S.inv.abierta=true;go('invitacion')},

 notasave(el){const ev=evById(el.dataset.id);ev.notas=el.value;toast('Notas guardadas.','ok')},
 fotosave(){const ev=evById(S.ficha),l=(S.fl||'').trim();if(!/^https?:\/\/\S+$/.test(l)){toast('Pegá un enlace que empiece con https://','warn');return}
  ev.fotos={link:l,cargado:TODAY,vence:addDays(TODAY,CFG.fotos.dias)};S.fl='';ev.hist.push(nowStr()+' · Enlace de fotos cargado, vence el '+fshort(ev.fotos.vence));toast('Listo. Se avisó a la familia por WhatsApp y e-mail (en el demo es simulado).','ok');render(true)},
 fotoquitar(){const ev=evById(S.ficha);ev.fotos=null;ev.hist.push(nowStr()+' · Enlace de fotos quitado');render(true)},
 /* panel: solicitudes */
 conf(el){const ev=evById(el.dataset.id);if(confirmar(ev)){notify('ok','Confirmaste a '+nameOf(ev)+' para el '+fdate(ev.fecha)+'.',null);toast('Reserva confirmada. Se avisa a la familia.','ok')}render(true)},
 rech(el){const ev=evById(el.dataset.id);ev.estado='rechazada';ev.hist.push(nowStr()+' · Comprobante rechazado');toast('Solicitud rechazada.','info');render(true)},
 venc(el){const ev=evById(el.dataset.id);ev.estado='vencida';ev.hist.push(nowStr()+' · Venció el plazo para enviar la seña');toast('Solicitud marcada como vencida.','info');render(true)},
 devolver(el){const ev=evById(el.dataset.id);ev.pagos.forEach(p=>{if(!p.anulado){p.anulado=true;p.motivo='Seña devuelta (turno ocupado)'}});ev.estado='cancelada';ev.hist.push(nowStr()+' · Seña devuelta, reserva cancelada');toast('Registrado: seña devuelta.','ok');render(true)},
 reprog(el){const ev=evById(el.dataset.id);S.rp={id:ev.id,f:'',t:ev.turno};
  modal('Reprogramar a otra fecha','<div class="stack"><p class="muted">'+esc(nameOf(ev))+' conserva la seña ya pagada.</p><div class="f-grid"><div class="field"><label for="rpf">Nueva fecha</label><input id="rpf" type="date" data-in="rp.f"></div><div class="field"><label for="rpt">Turno</label><select id="rpt" data-in="rp.t">'+CFG.turnos.filter(t=>t.activo).map(t=>'<option value="'+t.id+'"'+(t.id===ev.turno?' selected':'')+'>'+esc(t.n)+' · '+t.ini+' a '+t.fin+'</option>').join('')+'</select></div></div><div class="row"><button class="btn" data-act="rpsave">Reprogramar</button><button class="btn suave" data-act="close">Cancelar</button></div></div>')},
 rpsave(){const r=S.rp,ev=evById(r.id);if(!r.f||r.f<=TODAY){toast('Elegí una fecha futura.','warn');return}
  if(!turnosDia(r.f).some(t=>t.id===r.t)){toast('Ese turno no funciona ese día.','warn');return}

  ev.pagos.forEach(p=>{if(p.nota==='Seña recibida, turno ocupado'){p.nota='';p.n=++rcpt}});
  closeLayer();toast('Reserva reprogramada y confirmada.','ok');render(true)},
 /* panel: agenda */

  modal('Ajustar horario de este día','<div class="stack"><p class="muted">Solo cambia el '+esc(fdate(f,true))+'. Los demás días siguen igual.</p><div class="f-grid"><div class="field"><label for="ajI">Desde</label><input id="ajI" type="time" data-in="aj.ini" value="'+tm.ini+'"></div><div class="field"><label for="ajF">Hasta</label><input id="ajF" type="time" data-in="aj.fin" value="'+tm.fin+'"></div></div><div class="row"><button class="btn" data-act="ajsave">Guardar</button><button class="btn suave" data-act="ajreset">Volver al horario normal</button></div></div>')},

 bloquear(el){CFG.bloq=CFG.bloq||{};const k=el.dataset.f+'|'+el.dataset.t;if(CFG.bloq[k])delete CFG.bloq[k];else CFG.bloq[k]=1;render(true)},
 manual(el){S.man.fecha=el.dataset.f||S.ag.day||'';S.man.turno=el.dataset.t||'t1';
  const fld=(k,l,t)=>'<div class="field"><label>'+l+'<input '+(t?'type="'+t+'" ':'')+'data-in="man.'+k+'" value="'+esc(S.man[k])+'"></label></div>';
  modal('Cargar una reserva','<div class="stack"><p class="muted">Para reservas que llegan por teléfono o WhatsApp. Queda confirmada y registra la seña en efectivo.</p><div class="f-grid">'+fld('fecha','Fecha','date')+'<div class="field"><label for="mt">Turno</label><select id="mt" data-in="man.turno">'+CFG.turnos.map(t=>'<option value="'+t.id+'"'+(t.id===S.man.turno?' selected':'')+'>'+esc(t.n)+' · '+t.ini+' a '+t.fin+'</option>').join('')+'</select></div><div class="field"><label for="mc">Combo</label><select id="mc" data-in="man.combo">'+COMBOS.map(c=>'<option value="'+c.id+'">'+c.n+'</option>').join('')+'</select></div>'+fld('n','Nombre')+fld('a','Apellido')+fld('wa','WhatsApp')+fld('cn','Cumpleañero o cumpleañera')+fld('ce','Edad','number')+'</div><div class="row"><button class="btn" data-act="mansave">Guardar reserva</button><button class="btn suave" data-act="close">Cancelar</button></div></div>',true)},

 /* panel: pagos */
 paysave(){const ev=evById(S.ficha),p=S.pay,base=Number(p.monto)||0;
  if(base<=0){toast('Ingresá el importe.','warn');return}
  if(base>saldo(ev)){toast('El importe supera el saldo ('+money(saldo(ev))+').','warn');return}
  const o={nota:p.nota,n:++rcpt};
  if(p.concepto==='seña'&&(p.medio==='tarjeta'||p.medio==='debito')){toast('La seña se abona solo en efectivo o por transferencia.','warn');rcpt--;return}
  if(p.medio==='debito'){if(!p.cupon.trim()){toast('Cargá el número de cupón.','warn');rcpt--;return}const rc=recargo(base,CFG.debito.pct);Object.assign(o,{tarjeta:'Débito',cuotas:1,pct:CFG.debito.pct,recargo:rc,total:base+rc,cupon:p.cupon.trim()})}
  if(p.medio==='tarjeta'){if(!p.cupon.trim()){toast('Cargá el número de cupón.','warn');rcpt--;return}
   const tj=CFG.tarjetas[p.tj],pl=tj.planes[p.cu];const rc=recargo(base,pl.pct);Object.assign(o,{tarjeta:tj.n,cuotas:pl.c,pct:pl.pct,recargo:rc,total:base+rc,cupon:p.cupon.trim()})}
  const pg=pago('p'+Date.now(),TODAY,p.concepto,p.medio,base,o);ev.pagos.push(pg);
  ev.hist.push(nowStr()+' · '+p.concepto[0].toUpperCase()+p.concepto.slice(1)+' de '+money(base)+' ('+p.medio+') · recibo '+String(pg.n).padStart(7,'0'));
  S.pay.monto='';S.pay.cupon='';S.pay.nota='';toast('Pago registrado. Saldo: '+money(saldo(ev)),'ok');render(true);ACT.recibo({dataset:{e:ev.id,id:pg.id}})},
 recibo(el){const ev=evById(el.dataset.e),p=ev.pagos.find(x=>x.id===el.dataset.id);
  modal('Recibo Nº '+String(p.n||0).padStart(7,'0'),'<div class="stack"><div class="row"><img src="'+IMG.logo.src+'" alt="" width="56" height="56"><div><b>BenTom Universo de Aventuras</b><br><small class="muted">'+esc(CFG.direccion)+'</small></div></div><dl class="dl"><dt>Fecha</dt><dd>'+fshort(p.fecha)+'</dd><dt>Recibimos de</dt><dd>'+nameOf(ev)+'</dd><dt>Evento</dt><dd>'+esc(ev.cumple.n)+' · '+esc(fdate(ev.fecha))+'</dd><dt>Concepto</dt><dd>'+esc(p.concepto)+'</dd><dt>Forma de pago</dt><dd>'+esc(p.medio==='debito'?'tarjeta de débito':p.medio==='tarjeta'?'tarjeta de crédito':p.medio)+((p.medio==='tarjeta'||p.medio==='debito')?' · '+esc(p.tarjeta)+(p.medio==='tarjeta'?' · '+p.cuotas+' '+(p.cuotas===1?'cuota':'cuotas'):'')+' · cupón '+esc(p.cupon):'')+'</dd></dl><div class="pay-row"><span>Importe aplicado al evento</span><b class="tnum">'+money(p.base)+'</b></div>'+(p.recargo?'<div class="pay-row"><span>Recargo '+p.pct+'%</span><b class="tnum">'+money(p.recargo)+'</b></div>':'')+'<div class="pay-row"><b>Total cobrado</b><b class="tnum">'+money(p.total)+'</b></div><div class="pay-row"><span>Saldo restante del evento</span><b class="tnum">'+money(saldo(ev))+'</b></div><button class="btn" data-act="close">Cerrar</button></div>')},
 anular(el){S.an={e:el.dataset.e,id:el.dataset.id,m:''};
  modal('Anular pago','<div class="stack"><p class="muted">Los pagos no se borran: se anulan y queda el motivo en el historial.</p><div class="field"><label for="anm">Motivo</label><textarea id="anm" data-in="an.m"></textarea></div><div class="row"><button class="btn" data-act="ansave">Anular pago</button><button class="btn suave" data-act="close">Cancelar</button></div></div>')},
 ansave(){const a=S.an;if(a.m.trim().length<3){toast('Escribí el motivo.','warn');return}
  const ev=evById(a.e),p=ev.pagos.find(x=>x.id===a.id);p.anulado=true;p.motivo=a.m.trim();ev.hist.push(nowStr()+' · Pago anulado ('+money(p.base)+'): '+p.motivo);closeLayer();toast('Pago anulado. El saldo se actualizó.','ok');render(true)}
});
document.addEventListener('submit',e=>{
 const f=e.target;if(f.dataset.form!=='wiz')return;e.preventDefault();
 if(validar()){crearReserva();render();window.scrollTo(0,0)}else{render(true)}
});

if(CFG.recaptura.on)oportunidades().forEach(o=>notify('info','Se acerca el cumple de '+o.e.cumple.n+' ('+fshort(o.p.f).slice(0,5)+', cumple '+o.p.edad+'). Ofrecele un nuevo festejo a '+nameOf(o.e)+'.',['historial']));
render();

</script>
